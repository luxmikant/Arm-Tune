name: Publish Python package

on:
  release:
    types: [published]

permissions:
  contents: read
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Build distributions
        run: |
          python -m pip install --upgrade build twine
          python -m build
          python -m twine check dist/*
      - name: Upload distributions as workflow artifacts
        uses: actions/upload-artifact@v5
        with:
          name: python-distributions
          path: dist/

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/armtune-serve
    permissions:
      id-token: write
    steps:
      - name: Download distributions
        uses: actions/download-artifact@v5
        with:
          name: python-distributions
          path: dist/
      - name: Check whether project exists on PyPI
        id: pypi-project
        run: |
          if curl -fsS https://pypi.org/pypi/armtune-serve/json >/dev/null; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Publish to PyPI with trusted publisher
        id: trusted-publish
        continue-on-error: true
        uses: pypa/gh-action-pypi-publish@release/v1
      - name: Publish first release with API token fallback
        if: ${{ steps.trusted-publish.outcome == 'failure' && steps.pypi-project.outputs.exists == 'false' && secrets.PYPI_API_TOKEN != '' }}
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          user: __token__
          password: ${{ secrets.PYPI_API_TOKEN }}
      - name: Fail when trusted publishing failed and token fallback is unavailable
        if: ${{ steps.trusted-publish.outcome == 'failure' && (steps.pypi-project.outputs.exists == 'true' || secrets.PYPI_API_TOKEN == '') }}
        run: |
          echo "Trusted publishing to armtune-serve failed."
          echo "Confirm the PyPI pending publisher matches owner=luxmikant, repository=Arm-Tune, workflow=publish-pypi.yml, environment=pypi."
          if [ "${{ steps.pypi-project.outputs.exists }}" = "false" ]; then
            echo "For a first release, either fix the pending publisher or set an account-scoped PYPI_API_TOKEN as a fallback."
          fi
          exit 1
