name: Test ARM64

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Lint (ruff)
        run: ruff check armtune/ tests/

      - name: Type check (mypy)
        continue-on-error: true
        run: mypy armtune/ --ignore-missing-imports

      - name: Run tests
        run: pytest tests/ -v

      - name: Detect hardware
        run: python -c "
import platform
import subprocess
print(f'Architecture: {platform.machine()}')
print(f'Python: {platform.python_version()}')
result = subprocess.run(['lscpu'], capture_output=True, text=True)
print(result.stdout[:2000])
result2 = subprocess.run(['free', '-h'], capture_output=True, text=True)
print(result2.stdout)
        "

      - name: Smoke test CLI
        run: |
          armtune --version
          armtune detect --json
