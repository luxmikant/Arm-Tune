name: Test ARM64

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install system deps
        run: sudo apt-get update -qq && sudo apt-get install -y -qq numactl hwloc 2>/dev/null || true

      - name: Install package
        run: python -m pip install --upgrade pip && pip install -e ".[dev]"

      - name: Lint (ruff)
        run: ruff check armtune/ tests/

      - name: Run tests
        run: pytest tests/ -v

      - name: Record hardware (ARM64)
        run: |
          echo "=== uname -a ==="
          uname -a
          echo "=== CPU ==="
          lscpu 2>&1 || true
          echo "=== Memory ==="
          free -h
          echo "=== Cores ==="
          nproc

      - name: Smoke test CLI
        run: |
          armtune --version
          mkdir -p results
          armtune detect --json | tee results/hardware.json
