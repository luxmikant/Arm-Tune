name: Benchmark ARM64

on:
  workflow_dispatch:
    inputs:
      profile:
        description: Profile name or path
        type: string
        default: balanced
      model:
        description: Model file path (relative) or huggingface repo
        type: string
        default: unsloth/Llama-3.2-1B-Instruct-GGUF
      model_file:
        description: GGUF filename
        type: string
        default: Llama-3.2-1B-Instruct-Q4_K_M.gguf
  schedule:
    - cron: "0 8 * * 1"

permissions:
  contents: read
  actions: read

jobs:
  benchmark:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 60

    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Record hardware information
        run: |
          echo "=== uname -a ==="
          uname -a
          echo "=== lscpu ==="
          lscpu 2>&1 || true
          echo "=== free -h ==="
          free -h
          echo "=== nproc ==="
          nproc
          echo "=== /proc/cpuinfo (first 2 cores) ==="
          head -100 /proc/cpuinfo || true
          echo "=== NUMA ==="
          numactl --hardware 2>&1 || true
          echo "=== /proc/meminfo ==="
          head -20 /proc/meminfo || true

      - name: Install system dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq numactl hwloc 2>/dev/null || true

      - name: Install Python package
        run: |
          python -m pip install --upgrade pip
          pip install -e .

      - name: Install Arm Performix CLI
        run: bash scripts/install-performix.sh

      - name: Install llama-cpp-python
        run: |
          pip install llama-cpp-python --extra-index-url https://abetlen.github.io/llama-cpp-python/whl/cpu 2>/dev/null || \
          pip install llama-cpp-python 2>/dev/null || \
          echo "Warning: llama-cpp-python install failed. Continuing with mock adapter."

      - name: Download model
        run: bash scripts/download-model.sh models "${{ inputs.model || 'unsloth/Llama-3.2-1B-Instruct-GGUF' }}" "${{ inputs.model_file || 'Llama-3.2-1B-Instruct-Q4_K_M.gguf' }}"

      - name: Run hardware detection
        run: armtune detect --json | tee results/hardware.json

      - name: Run baseline benchmark
        run: armtune benchmark --profile configs/baseline.yaml --output results

      - name: Run optimized benchmark
        run: armtune benchmark --profile "configs/${{ inputs.profile || 'balanced' }}.yaml" --output results

      - name: Generate recommendation
        run: armtune recommend --latest

      - name: Generate report
        run: armtune report --latest

      - name: Upload benchmark artifacts
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: benchmark-results-${{ github.run_id }}
          path: |
            results/
            !results/*.pkl
            !results/*.gguf
          retention-days: 30

      - name: Upload Performix profiles
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: performix-profiles-${{ github.run_id }}
          path: results/performix*.json
          retention-days: 30
