name: Benchmark ARM64

on:
  workflow_dispatch:
    inputs:
      profile:
        description: Profile to benchmark
        type: choice
        default: balanced
        options:
          - baseline
          - balanced
          - low-latency
          - high-throughput
          - low-memory
      repo:
        description: HuggingFace GGUF repo
        type: string
        default: unsloth/Llama-3.2-1B-Instruct-GGUF
      quant:
        description: Quantization (csv)
        type: string
        default: Q4_K_M,Q4_0,Q8_0
      threads:
        description: Thread sweep (csv)
        type: string
        default: 1,2,4
      concurrency:
        description: Concurrency sweep (csv)
        type: string
        default: 1,2
  schedule:
    - cron: "0 8 * * 1"

permissions:
  contents: write
  actions: write

jobs:
  benchmark:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 90

    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Create results directory
        run: mkdir -p results

      - name: Record hardware inventory
        run: |
          {
            echo "=== uname -a ==="; uname -a
            echo ""; echo "=== lscpu ==="; lscpu 2>&1 || true
            echo ""; echo "=== free -h ==="; free -h
            echo ""; echo "=== nproc ==="; nproc
            echo ""; echo "=== NUMA ==="; numactl --hardware 2>&1 || true
            echo ""; echo "=== /proc/cpuinfo (header) ==="; head -80 /proc/cpuinfo
          } | tee results/hardware-inventory.txt

      - name: Install system dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq cmake gcc g++ build-essential numactl hwloc 2>/dev/null || true

      - name: Install Python package
        run: |
          python -m pip install --upgrade pip
          pip install -e .

      - name: Install Arm Performix CLI
        run: bash scripts/install-performix.sh
        continue-on-error: true

      - name: Cache llama.cpp build
        id: cache-llama
        uses: actions/cache@v4
        with:
          path: llama.cpp/build-*
          key: llama-cpp-build-${{ runner.arch }}-${{ hashFiles('scripts/build-llama-cpp.sh') }}

      - name: Build llama.cpp (KleidiAI + generic)
        if: steps.cache-llama.outputs.cache-hit != 'true'
        run: bash scripts/build-llama-cpp.sh
        timeout-minutes: 40

      - name: Download models from Hugging Face
        run: |
          for q in $(echo "${{ inputs.quant || 'Q4_K_M,Q4_0,Q8_0' }}" | tr ',' ' '); do
            armtune models pull "${{ inputs.repo || 'unsloth/Llama-3.2-1B-Instruct-GGUF' }}" --quant "$q" --output models
          done
        timeout-minutes: 15

      - name: ArmTune detect
        run: armtune detect --json | tee results/hardware.json

      # ---------- Baseline: generic build ----------
      - name: Run generic (baseline) benchmark
        run: |
          export ARMTUNE_LLAMA_SERVER="llama.cpp/build-generic/bin/llama-server"
          armtune benchmark \
            --profile configs/baseline.yaml \
            --repo "${{ inputs.repo || 'unsloth/Llama-3.2-1B-Instruct-GGUF' }}" \
            --quant "${{ inputs.quant || 'Q4_K_M,Q4_0,Q8_0' }}" \
            --threads "${{ inputs.threads || '1,2,4' }}" \
            --concurrency "${{ inputs.concurrency || '1,2' }}" \
            --output results
        continue-on-error: true
        timeout-minutes: 25

      # ---------- Optimized: KleidiAI native build ----------
      - name: Run Arm-optimized benchmark
        run: |
          export ARMTUNE_LLAMA_SERVER="llama.cpp/build-arm-opt/bin/llama-server"
          armtune benchmark \
            --profile "configs/${{ inputs.profile || 'balanced' }}.yaml" \
            --repo "${{ inputs.repo || 'unsloth/Llama-3.2-1B-Instruct-GGUF' }}" \
            --quant "${{ inputs.quant || 'Q4_K_M,Q4_0,Q8_0' }}" \
            --threads "${{ inputs.threads || '1,2,4' }}" \
            --concurrency "${{ inputs.concurrency || '1,2' }}" \
            --output results
        continue-on-error: true
        timeout-minutes: 25

      - name: Generate recommendation
        run: armtune recommend --latest --results results || true
        continue-on-error: true

      - name: Generate report
        run: armtune report --latest --results results || true
        continue-on-error: true

      - name: Upload benchmark artifacts
        uses: actions/upload-artifact@v5
        if: always()
        with:
          name: benchmark-results-${{ github.run_id }}
          path: results/*
          retention-days: 30
