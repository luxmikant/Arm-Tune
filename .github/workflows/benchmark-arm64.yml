name: Benchmark ARM64

on:
  workflow_dispatch:
    inputs:
      profile:
        description: Profile to benchmark
        type: choice
        default: balanced
        options:
          - baseline
          - balanced
          - low-latency
          - high-throughput
          - low-memory
      model:
        description: HuggingFace GGUF repo
        type: string
        default: unsloth/Llama-3.2-1B-Instruct-GGUF
      model_file:
        description: GGUF filename
        type: string
        default: Llama-3.2-1B-Instruct-Q4_K_M.gguf
  schedule:
    - cron: "0 8 * * 1"

permissions:
  contents: write
  actions: write

jobs:
  benchmark:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 60

    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Create results directory
        run: mkdir -p results

      # ---------- Hardware inventory ----------
      - name: Record hardware inventory
        run: |
          echo "=== uname -a ==="               | tee results/hardware-inventory.txt
          uname -a                                | tee -a results/hardware-inventory.txt
          echo ""                                 | tee -a results/hardware-inventory.txt
          echo "=== lscpu ==="                   | tee -a results/hardware-inventory.txt
          lscpu 2>&1                              | tee -a results/hardware-inventory.txt
          echo ""                                 | tee -a results/hardware-inventory.txt
          echo "=== free -h ==="                 | tee -a results/hardware-inventory.txt
          free -h                                 | tee -a results/hardware-inventory.txt
          echo ""                                 | tee -a results/hardware-inventory.txt
          echo "=== nproc ==="                   | tee -a results/hardware-inventory.txt
          nproc                                   | tee -a results/hardware-inventory.txt
          echo ""                                 | tee -a results/hardware-inventory.txt
          echo "=== /proc/cpuinfo (header) ==="  | tee -a results/hardware-inventory.txt
          head -80 /proc/cpuinfo 2>&1             | tee -a results/hardware-inventory.txt
          echo ""                                 | tee -a results/hardware-inventory.txt
          echo "=== NUMA ==="                    | tee -a results/hardware-inventory.txt
          numactl --hardware 2>&1                 | tee -a results/hardware-inventory.txt || true
          echo ""                                 | tee -a results/hardware-inventory.txt
          echo "=== /proc/meminfo (header) ==="  | tee -a results/hardware-inventory.txt
          head -20 /proc/meminfo 2>&1             | tee -a results/hardware-inventory.txt

      # ---------- System deps ----------
      - name: Install system dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq numactl hwloc 2>/dev/null || true

      # ---------- Python + package ----------
      - name: Install Python package
        run: |
          python -m pip install --upgrade pip
          pip install -e .

      # ---------- Arm Performix ----------
      - name: Install Arm Performix CLI
        run: bash scripts/install-performix.sh
        continue-on-error: true

      - name: Verify Performix
        run: |
          if [ -x "$HOME/.armtune/performix/ArmPerformix" ]; then
            "$HOME/.armtune/performix/ArmPerformix" --version 2>&1 || echo "(version check: not available)"
          else
            echo "Arm Performix not installed — continuing without hardware counter profiling."
          fi
        continue-on-error: true

      # ---------- llama-cpp ----------
      - name: Install llama-cpp-python (ARM64)
        run: |
          pip install llama-cpp-python 2>&1 || echo "LLAMA_NOT_AVAILABLE=true" >> "$GITHUB_ENV"
        continue-on-error: true

      # ---------- Model download ----------
      - name: Download model
        id: model
        run: |
          REPO="${{ inputs.model || 'unsloth/Llama-3.2-1B-Instruct-GGUF' }}"
          FILE="${{ inputs.model_file || 'Llama-3.2-1B-Instruct-Q4_K_M.gguf' }}"
          bash scripts/download-model.sh models "$REPO" "$FILE" && echo "MODEL_PATH=models/$FILE" >> "$GITHUB_ENV" || echo "MODEL_DOWNLOAD_FAILED=true" >> "$GITHUB_ENV"
        continue-on-error: true
        timeout-minutes: 15

      # ---------- Hardware detect (CLI) ----------
      - name: ArmTune detect
        run: armtune detect --json | tee results/hardware.json

      # ---------- Benchmarks ----------
      - name: Run baseline benchmark
        run: |
          if [ -n "$MODEL_PATH" ] && [ -f "$MODEL_PATH" ]; then
            armtune benchmark --profile configs/baseline.yaml --output results
          else
            echo "No model available — running mock benchmark."
            armtune benchmark --profile configs/baseline.yaml --output results || true
            echo "MOCK_BENCHMARK=true" >> "$GITHUB_ENV"
          fi
        continue-on-error: true

      - name: Run optimized benchmark
        run: |
          PROFILE="configs/${{ inputs.profile || 'balanced' }}.yaml"
          if [ -f "$PROFILE" ]; then
            armtune benchmark --profile "$PROFILE" --output results || true
          else
            echo "Profile $PROFILE not found — skipping."
          fi
        continue-on-error: true

      # ---------- Analysis ----------
      - name: Generate recommendation
        run: armtune recommend --latest --results results || true
        continue-on-error: true

      - name: Generate report
        run: armtune report --latest --results results || true
        continue-on-error: true

      # ---------- Artifacts ----------
      - name: Upload benchmark artifacts
        uses: actions/upload-artifact@v5
        if: always()
        with:
          name: benchmark-results-${{ github.run_id }}
          path: results/*
          retention-days: 30
