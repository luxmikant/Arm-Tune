name: low-memory
objective: low-memory
label: low-memory-q2k
model:
  name: llama-3.2-1b
  family: llama
  repo_id: unsloth/Llama-3.2-1B-Instruct-GGUF
  quantization: Q2_K
  context_size: 2048
  batch_size: 512
  gpu_layers: 0
runtime:
  threads: 2
  concurrency: 1
  enable_prompt_cache: false
  enable_mmap: true
  enable_mlock: false
benchmark:
  warmup_requests: 2
  measurement_requests: 10
  max_tokens: 256
  temperature: 0.0
  seed: 42
  prompt_set: support_tickets
performix:
  enabled: true
  sample_period_ms: 10
  collect_cache_metrics: true
  collect_instruction_metrics: true
  collect_memory_bandwidth: true
  output_format: json
