[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "armtune-serve"
version = "0.1.0"
description = "Arm64-aware LLM inference optimization toolkit powered by Arm Performix."
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.10"
authors = [{ name = "ArmTune Serve contributors" }]
keywords = ["arm64", "llm", "inference", "benchmarking", "llama-cpp", "arm-performix", "optimization"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3 :: Only",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "psutil>=5.9",
    "pydantic>=2.5",
    "rich>=13.0",
    "typer>=0.9",
    "jinja2>=3.1",
    "matplotlib>=3.7",
    "pandas>=2.0",
    "pyyaml>=6.0",
    "httpx>=0.25",
    "huggingface_hub>=0.20",
]

[project.urls]
Homepage = "https://github.com/luxmikant/Arm-Tune"
Repository = "https://github.com/luxmikant/Arm-Tune"
Issues = "https://github.com/luxmikant/Arm-Tune/issues"

[project.optional-dependencies]
dev = [
    "pytest>=7.4",
    "pytest-cov>=4.1",
    "ruff>=0.1",
    "mypy>=1.7",
]
dashboard = [
    "gradio>=4.0",
]

[project.scripts]
armtune = "armtune.cli:app"

[tool.setuptools.packages.find]
where = ["."]
include = ["armtune*"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "W", "C4"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.10"
strict = false
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = "-ra -q"
